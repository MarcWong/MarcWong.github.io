career-profile:
    title: 关于我
    summary: |
       我是王尧（Yao/Marc Wang），现为斯图加特大学（University of Stuttgart）博士后研究员。我的研究目标是理解人类感知机制，并借助眼动追踪技术改善人机交互体验。我的博士生导师是 <a href="https://collaborative-ai.org/people/bulling/">Prof. Dr. Andreas Bulling</a>。
education:
    title: 教育背景
    info:
      - degree: 计算机科学博士
        university: 斯图加特大学 (University of Stuttgart)
        time: 2020 - 2024
        honor: 最高荣誉学位 (1.0)
        details: |
            - 最高荣誉学位 (summa cum laude, 1.0)
            - 可视化与交互系统研究所 (Institute of Visualisation and Interactive System)
      - degree: 计算机软件与理论硕士
        university: 北京大学 (Peking University)
        time: 2017 - 2020
