career-profile:
    title: About Me
    summary: |
       I am Yao (Marc) Wang, Chinese name 王尧, a Postdoctoral researcher at the University of Stuttgart. My research goal is to understand human perception and improving human-AI interaction via eye tracking. I did my PhD supervised by <a href="https://collaborative-ai.org/people/bulling/">Prof. Dr. Andreas Bulling</a>. I was a visiting PhD student at the Aalto University in Prof. Antti Oulasvirta's group in 2023. 
education:
