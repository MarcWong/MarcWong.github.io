    info:
      - degree: PhD in Computer Science
        university: University of Stuttgart
        time: 2020 - 2024
        honor: Summa cum laude (1.0)
        details: |
            - Summa cum laude (1.0)
            - Institute of Visualisation and Interactive System
            - Collaborative AI Lab
      - degree: M.Sc. in Computer Software and Technology
        university: Peking University
        time: 2017 - 2020
        details: |
            - GPA: 3.50 / 4.0
            - key courses: Image and Video Based 3D Reconstruction, Computational Vision, Advanced Graphics Computing, Technique and Application of Deep Learning, Human Computer Interaction: Theory and Techniques
      - degree: B.Sc. in Intelligence Science and Technology
        university: Peking University
        time: 2013 - 2017
        details: |
            - GPA: 3.34 / 4.0
            - key courses: Data Structures and Algorithms, Algorithm Design and Analysis, Introduction to Computer Systems, Introduction to Pattern Recognition, Digital Image Processing, Set and Graph Theory, Web Software Technology
# experiences:
#     title: Experiences
#     info:
#       - role: PhD Student
#         time: 2020 - 2024
#         company: University of Stuttgart
#         details: |
#           My PhD topic is visual attention modelling for optimization of information visualizations, which integrated to Project A07 in <a href="https://www.sfbtrr161.de/research/project_a07/">SFB-TRR 161</a>.
#           My first research goal is acquiring large-scale humanlike attention data without eye tracking equipment on information visualizations. I turn to crowdsourcing approaches (webcam or mouse-clicking) or gaze data synthesis by generative or cognitive models. My second research goal is to computationally model human visual behaviour (saliency map, scanpath) under different tasks (top-down) in information visualizations. My third research goal is to optimize information visualisation design by maximising perceptual metrics.

